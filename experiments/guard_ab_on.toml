# W3 单变量 A/B 实验组：只开启 schema_validation 一条护栏。
#
# 与 guard_ab_off.toml 的测量输入逐字段相同，唯一自变量是 enabled。
# compare 指向 OFF 组留档的 result_rows.jsonl，报告因此切换成
# 「与对照组对照（A/B）」版式——这才是可以作因果解读的对照；
# 「与冻结基线对照」是跨后端的，只能看数值不能归因。
#
# 运行前必须先跑 OFF 组，让下面的 result_rows.jsonl 存在。
# 复现：python -m eval.run --config experiments/guard_ab_on.toml
[experiment]
name = "w3_ab_on"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "seeded"
compare = "experiments/runs/w3_ab_off-346ab5e98382/result_rows.jsonl"

[guards]
max_steps = 12
max_json_retries = 2
enabled = ["schema_validation"]

[seeded]
seed = 11
fault_per_mille = 60
