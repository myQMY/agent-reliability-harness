# W3 第三条护栏的单变量 A/B 实验组：只开启 tool_retry。
#
# 与 guard_ab_off.toml 的测量输入逐字段相同（tasks / k / backend / seed /
# fault_per_mille / max_steps / max_json_retries），唯一自变量是
# [guards].enabled。name 与 compare 只决定报告落盘位置与对照来源，
# 不进入测量链路；tests/test_tool_retry_guard.py 会逐字段断言这一点。
#
# 这是路线表里「退避」的落地：工具层报错后要求后端重发干净动作，
# 固定次数重试预算，不做真实 sleep（否则破坏逐字节复现）。
# 跨 seed 的效应符号分布由 python -m eval.ab_sweep 单独产出，
# 单次 A/B 不算可复现结论 —— 这是 w3_robustness.md 立下的纪律。
#
# 运行前必须先跑 OFF 组，让下面的 result_rows.jsonl 存在。
# 复现：python -m eval.run --config experiments/guard_ab_retry.toml
[experiment]
name = "w3_retry_on"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "seeded"
compare = "experiments/runs/w3_ab_off-346ab5e98382/result_rows.jsonl"

[guards]
max_steps = 12
max_json_retries = 2
enabled = ["tool_retry"]

[seeded]
seed = 11
fault_per_mille = 60
