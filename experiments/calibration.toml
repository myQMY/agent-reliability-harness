# W2.5 测量链路校准配置：验证 SeededBackend 能让 pass^k 首次具备区分度。
#
# 这份配置只做校准，不构成能力结论：故障是按固定 seed 人为注入的噪声，
# 后端没有语言理解能力。它不是 W1 冻结基线的等价配置，也绝不能拿
# 「与冻结基线对照」表做因果解读（报告里已标注跨后端警告）。
#
# 复现：python -m eval.run --config experiments/calibration.toml
[experiment]
name = "calibration_seeded"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "seeded"
compare = "experiments/baseline/result_rows.jsonl"

[guards]
# 与 W1 冻结基线一致，本轮不调整任何护栏
max_steps = 12
max_json_retries = 2

[seeded]
# 固定种子：同配置必得同一串结果，跨机器可复现。
# 这组参数实测得到 pass¹=0.20 > pass³=0.10：T01 偶尔失败、T05 稳定通过，
# 既有区分度，又不是「全部失败」这种没有信息量的极端。
seed = 11
# 每个脚本动作注入故障的千分比；0 等价于 ScriptedBackend。
# 40 / 60 / 80 三档结果一致，取 60 避免踩在概率边界上。
fault_per_mille = 60
