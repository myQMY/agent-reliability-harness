# W3 护栏 2×2 全因子实验：两条护栏同时开启。
#
# 这一格不是新的自变量，而是同一个 [guards].enabled 字段的第三个取值，
# 用来和另外三格一起算交互效应（difference-in-differences）。相对 OFF 组
# 它一次改了两项，因此**不能**单独拿它的 A/B 表当「单变量因果证据」；
# 单变量结论请读 OFF↔schema 与 OFF↔idem 两条边，交互请读矩阵报告。
#
# 测量输入与另外三份配置逐字段相同；compare 指向 OFF 组留档。
# 复现：python -m eval.run --config experiments/guard_ab_both.toml
[experiment]
name = "w3_both_on"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "seeded"
compare = "experiments/runs/w3_ab_off-346ab5e98382/result_rows.jsonl"

[guards]
max_steps = 12
max_json_retries = 2
enabled = ["schema_validation", "idempotency"]

[seeded]
seed = 11
fault_per_mille = 60
