# W4-b 实验组：openai + 输出级故障注入，四条护栏全开（ALL4）

# 与 w4b_off_flash.toml 构成单变量对照：测量链路上唯一不同的自变量是
# [guards].enabled。注入参数（seed / fault_per_mille）两格完全相同，
# 由 eval/w4_preflight.py 机器校验（seed / fault_per_mille 已并入单变量字段）。
#
# [seeded] 段名是历史命名，承载的是通用注入参数；见 OFF 配置里的说明。
# 输出被注入扰动，不是纯净模型行为；本组不得与 W4 首轮或 W3 归档做跨组比较。

[experiment]
name = "w4b_all4_flash"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "openai"
# 指向 W4-b OFF 组留档（由该组 run_id 确定性推导，不含时间戳）。
compare = "experiments/runs/w4b_off_flash-f6e556cd7201/result_rows.jsonl"

[guards]
max_steps = 12
max_json_retries = 2
enabled = ["schema_validation", "idempotency", "tool_retry", "json_recovery"]

[seeded]
seed = 11
fault_per_mille = 300
