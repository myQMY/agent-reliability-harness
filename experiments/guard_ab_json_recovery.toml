# W3 第四条护栏的单变量 A/B 实验组：只开启 json_recovery。
#
# 与 guard_ab_off.toml 的测量输入逐字段相同（tasks / k / backend / seed /
# fault_per_mille / max_steps / max_json_retries），唯一自变量是
# [guards].enabled。name 与 compare 只决定报告落盘位置与对照来源，
# 不进入测量链路；tests/test_json_recovery_guard.py 会逐字段断言这一点。
#
# json_recovery 覆盖四类注入故障里最后一条没有护栏覆盖的类别：bad_json。
# W1 的 JSON 重试只提示、会跳过被替换掉的动作；这条护栏保留原提示证据，
# 额外追加一条 [GUARD-REJECT] 消息触发重发。脚本固有的连续坏 JSON
# 没有干净动作可重发，依然失败 —— 护栏不越界。
#
# 跨 seed 的效应符号分布由 python -m eval.ab_sweep --treatment json_recovery
# 单独产出；可达上限分析见 python -m eval.ceiling。
#
# 运行前必须先跑 OFF 组，让下面的 result_rows.jsonl 存在。
# 复现：python -m eval.run --config experiments/guard_ab_json_recovery.toml
[experiment]
name = "w3_json_recovery_on"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "seeded"
compare = "experiments/runs/w3_ab_off-346ab5e98382/result_rows.jsonl"

[guards]
max_steps = 12
max_json_retries = 2
enabled = ["json_recovery"]

[seeded]
seed = 11
fault_per_mille = 60
