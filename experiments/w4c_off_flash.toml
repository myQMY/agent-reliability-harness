# W4-c 对照组：openai + 输出级故障注入 + 干净动作只读留档，护栏全关（OFF）

# 与 w4c_all4_flash.toml 构成单变量对照：测量链路上唯一不同的自变量是
# [guards].enabled。注入参数（seed / fault_per_mille）两格完全相同，
# 由 eval/w4_preflight.py 机器校验。
#
# 与 W4-b 的装置差异只有一处：OutputFaultBackend 在注入时把替换前的干净
# 动作留档，由 --clean-actions-dir 写到独立 side-car 目录。留档是事后观测，
# 绝不进 messages / system prompt / 拒绝文本，运行时也不读它构造响应
# （见 docs/w4c-design.md §2.3）。输出路径不进 run_id。
#
# [seeded] 段名是历史命名，承载的是通用注入参数。
# fault_per_mille=300 是**装置参数**，不是模型能力轴。
# 输出被注入扰动，不是纯净模型行为；本组不得与 W3 / W4 首轮 / W4-b
# 做任何跨组相减或拼曲线。

[experiment]
name = "w4c_off_flash"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "openai"
compare = ""

[guards]
max_steps = 12
max_json_retries = 2
# 故意不写 enabled：全部关闭，与 OFF 组语义一致。

[seeded]
seed = 11
fault_per_mille = 300
