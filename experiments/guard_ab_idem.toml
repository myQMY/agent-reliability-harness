# W3 护栏 2×2 全因子实验：只开 idempotency（schema_validation 关闭）。
#
# 四个格子共用同一份测量输入：tasks / k / backend / seed / fault_per_mille /
# max_steps / max_json_retries 逐字段相同，只有 [guards].enabled 不同：
#
#                     idempotency OFF        idempotency ON
#   schema OFF        guard_ab_off.toml     本文件
#   schema ON         guard_ab_on.toml      guard_ab_both.toml
#
# 因此既能做「一次只改一个变量」的 A/B，也能算两条护栏的主效应与交互效应。
# compare 统一指向 OFF 组留档，报告切换到「与对照组对照（A/B）」版式。
# name 与 compare 只影响落盘位置和对照来源，不进入测量链路；
# tests/test_idempotency_guard.py 逐字段断言四份配置的测量输入相同。
#
# 复现：python -m eval.run --config experiments/guard_ab_idem.toml
[experiment]
name = "w3_idem_on"
tasks = "tasks/mvp_10.jsonl"
k = 3
backend = "seeded"
compare = "experiments/runs/w3_ab_off-346ab5e98382/result_rows.jsonl"

[guards]
max_steps = 12
max_json_retries = 2
enabled = ["idempotency"]

[seeded]
seed = 11
fault_per_mille = 60
